<title>Payment Request - Premium Exact</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9e9e9;font-family:Arial,Tahoma,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.wrap{position:relative}
.page{position:relative;width:1414px;height:2000px;transform-origin:top left;background:#fff;box-shadow:0 2px 18px rgba(0,0,0,.18);overflow:hidden;direction:ltr}
.bg{position:absolute;inset:0;width:1414px;height:2000px;display:block;pointer-events:none;user-select:none}
.overlay{position:absolute;inset:0;z-index:2;pointer-events:none}

.box{position:absolute;pointer-events:auto;overflow:hidden!important;overflow:clip!important;clip-path:inset(0);contain:paint;background:transparent}
.box .value{position:absolute;inset:2px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden!important;padding:0 6px;outline:none;color:#111;background:transparent;font-family:Arial,Tahoma,"Segoe UI",sans-serif;font-weight:700;font-size:30px;line-height:1;unicode-bidi:plaintext}
.box .value.small{font-size:28px}

.line{position:absolute;pointer-events:auto;display:flex;align-items:flex-end;white-space:nowrap;overflow:hidden;padding:0 5px 4px;outline:none;background:transparent;color:#111;font-family:Arial,Tahoma,"Segoe UI",sans-serif;font-size:30px;font-weight:700;line-height:1;unicode-bidi:plaintext}
.line[dir="rtl"]{text-align:right}
.line[dir="ltr"]{text-align:left}

.check{position:absolute;pointer-events:auto;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Arial,Tahoma,sans-serif;font-size:43px;font-weight:700;line-height:1;color:#111;user-select:none}
.check input:checked+span::after{content:"✓"}

@page{size:A4 portrait;margin:0}
@media print{
 html,body{width:210mm;height:297mm;margin:0;padding:0;background:#fff;display:block;overflow:hidden}
 .wrap{width:210mm!important;height:297mm!important;overflow:hidden!important}
 .page{box-shadow:none!important;transform:scale(0.5613154173)!important;transform-origin:top left!important}
}
</style>

<script>
(()=>{
 const BASE_W=1414,BASE_H=2000,wrap=document.getElementById('wrap'),page=document.getElementById('page');
 function fitPage(){if(matchMedia('print').matches)return;const w=Math.max(320,Math.min(BASE_W,innerWidth-32)),s=w/BASE_W;wrap.style.width=(BASE_W*s)+'px';wrap.style.height=(BASE_H*s)+'px';page.style.transform='scale('+s+')'}
 addEventListener('resize',fitPage,{passive:true});fitPage();
 const prefix='payment-request-premium-v16:';
 const fields=[...document.querySelectorAll('[data-save]')];
 const measure=document.createElement('canvas').getContext('2d');
 function text(el){if(el.type==='checkbox')return'';return(el.textContent||'').replace(/[\n\r]+/g,' ')}
 function clean(el){if(el.type==='checkbox')return;const v=text(el);if(el.textContent!==v)el.textContent=v}
 function direction(el){if(el.type==='checkbox')return;const v=text(el).trim();if(!v){el.setAttribute('dir','auto');return}el.setAttribute('dir',/[\u0590-\u08FF]/.test(v.charAt(0))?'rtl':'ltr')}
 function fit(el){
   if(el.type==='checkbox')return;
   const key=el.dataset.save||'',isBox=el.classList.contains('value'),base=(key==='reference'||key==='currency')?28:30,min=isBox?14:20,v=text(el).trim();
   let size=base;el.style.fontSize=size+'px';if(!v)return;
   const available=Math.max(10,el.clientWidth-(isBox?14:10));
   while(size>min){measure.font='700 '+size+'px Arial, Tahoma, sans-serif';if(measure.measureText(v).width<=available)break;size--}
   el.style.fontSize=size+'px';
 }
 function save(el){try{localStorage.setItem(prefix+el.dataset.save,el.type==='checkbox'?(el.checked?'1':'0'):text(el))}catch(e){}}
 fields.forEach(el=>{
   try{const v=localStorage.getItem(prefix+el.dataset.save);if(v!==null){if(el.type==='checkbox')el.checked=v==='1';else el.textContent=v}}catch(e){}
   if(el.type!=='checkbox'){
     clean(el);direction(el);fit(el);
     el.addEventListener('paste',e=>{e.preventDefault();const v=(e.clipboardData||window.clipboardData).getData('text').replace(/[\n\r]+/g,' ');document.execCommand('insertText',false,v)});
     el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const ed=fields.filter(x=>x.type!=='checkbox'),i=ed.indexOf(el);if(i>=0&&ed[i+1])ed[i+1].focus()}});
     el.addEventListener('input',()=>{clean(el);direction(el);fit(el);save(el)});el.addEventListener('blur',()=>{fit(el);save(el)});
   }else el.addEventListener('change',()=>save(el));
 })
})();
</script>
