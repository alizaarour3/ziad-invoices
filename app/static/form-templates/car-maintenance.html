<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>كشف صيانة السيارات</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #e9e9e9; }
  body { font-family: Arial, Tahoma, sans-serif; direction: rtl; }
  .sheet {
    position: relative;
    width: 210mm;
    height: 297mm;
    margin: 0 auto;
    background: #fff;
    overflow: hidden;
    color: #000;
  }
  .watermark {
    position: absolute;
    z-index: 0;
    left: 17.53mm;
    top: 46.30mm;
    width: 165.10mm;
    height: 165.10mm;
    object-fit: contain;
    opacity: .135;
    pointer-events: none;
    user-select: none;
  }
  .title, .top-field, .signature, .maintenance-table { position: absolute; z-index: 1; }
  .title {
    top: 12.25mm;
    left: 17.53mm;
    right: 11.18mm;
    text-align: center;
    font-size: 14pt;
    line-height: 6.25mm;
    font-weight: 700;
    white-space: nowrap;
  }
  .top-field {
    left: 17.53mm;
    width: 181.29mm;
    height: 6.4mm;
    display: block;
    direction: rtl;
    text-align: right;
    font-size: 14pt;
    line-height: 6.2mm;
    font-weight: 700;
    white-space: nowrap;
  }
  .top-field.f1 { top: 24.10mm; }
  .top-field.f2 { top: 36.13mm; }
  .top-field.f3 { top: 48.16mm; }
  .top-field.f4 { top: 60.19mm; }
  .top-field.f1 input { right: 24mm; }
  .top-field.f2 input { right: 36mm; }
  .top-field.f3 input { right: 37mm; }
  .top-field.f4 input { right: 74mm; }
  .top-field .label { position: absolute; right: 0; top: 0; direction: rtl; text-align: right; }
  .top-field input {
    direction: rtl;
    position: absolute;
    left: 0;
    top: 0;
    width: 100mm;
    min-width: 0;
    height: 6mm;
    border: 0;
    outline: 0;
    padding: 0 2mm 0 0;
    margin: 0;
    background: transparent;
    font: inherit;
    font-weight: 400;
    text-align: right;
  }
  .maintenance-table {
    top: 71.43mm;
    left: 17.53mm;
    width: 181.29mm;
    height: 129.11mm;
    border-collapse: collapse;
    table-layout: fixed;
    direction: ltr;
    font-size: 11pt;
  }
  .maintenance-table col.notes { width: 40.80mm; }
  .maintenance-table col.shop { width: 28.30mm; }
  .maintenance-table col.amount { width: 27.60mm; }
  .maintenance-table col.fault { width: 72.97mm; }
  .maintenance-table col.seq { width: 11.62mm; }
  .maintenance-table th,
  .maintenance-table td {
    border: .5pt solid #222;
    padding: 0 1.9mm;
    vertical-align: middle;
    background: transparent;
    direction: rtl;
  }
  .maintenance-table thead tr { height: 11.53mm; }
  .maintenance-table tbody tr.data-row { height: 9.04mm; }
  .maintenance-table tbody tr.total-row { height: 9.36mm; }
  .maintenance-table th {
    font-size: 14pt;
    line-height: 5.15mm;
    text-align: center;
    font-weight: 700;
  }
  .maintenance-table td.seq {
    text-align: center;
    font-size: 11pt;
    font-weight: 700;
    padding: 0;
  }
  .maintenance-table td.total-label {
    text-align: center;
    font-size: 16pt;
    font-weight: 700;
    white-space: nowrap;
    padding: 0;
  }
  .cell-input {
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 0;
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    font-size: 11pt;
    direction: rtl;
    text-align: right;
  }
  .signature {
    left: 17.53mm;
    width: 181.29mm;
    height: 6.2mm;
    display: block;
    direction: rtl;
    text-align: right;
    font-size: 14pt;
    line-height: 6.2mm;
    font-weight: 700;
    white-space: nowrap;
  }
  .signature.s1 { top: 217.90mm; }
  .signature.s2 { top: 227.26mm; }
  .signature.s3 { top: 245.82mm; }
  .signature.s4 { top: 264.53mm; }
  .signature.s1 input { right: 24mm; }
  .signature.s2 input { right: 43mm; }
  .signature.s3 input { right: 43mm; }
  .signature.s4 input { right: 43mm; }
  .signature span { position: absolute; right: 0; top: 0; direction: rtl; text-align: right; }
  .signature input {
    position: absolute;
    left: 0;
    top: 0;
    width: 125mm;
    border: 0;
    outline: 0;
    background: transparent;
    height: 6mm;
    min-width: 0;
    padding: 0 2mm 0 0;
    margin: 0;
    font: inherit;
    font-weight: 400;
    direction: rtl;
    text-align: right;
  }
  @media print {
    html, body { background: #fff; width: 210mm; height: 297mm; }
    .sheet { margin: 0; box-shadow: none; }
    input { caret-color: transparent; }
  }
  @media screen {
    .sheet { box-shadow: 0 0 14px rgba(0,0,0,.18); }
  }
</style>
