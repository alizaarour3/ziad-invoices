  .date-label{ position:absolute; left:7.0mm; top:100.8mm; width:36.6mm; height:15.8mm; border:.35mm solid #111; background:#f5f5f5; display:flex; flex-direction:column; justify-content:center; align-items:center; font-weight:700; font-size:5.1mm; line-height:1.2; }
  .date-label .ar2{ font-size:5.2mm; direction:rtl; margin-top:1mm; }
  .date-input{ left:44.2mm; top:105.8mm; width:38.7mm; height:10.8mm; border:.35mm solid #111; padding:1.2mm 2mm; font-size:4.8mm; font-weight:600; background:#fff; }

  /* Middle labels and lines */
  .lbl{ position:absolute; left:7.0mm; display:flex; align-items:center; justify-content:center; background:#ddd; font-weight:700; font-size:5.3mm; direction:ltr; }
  .dept-lbl{ top:135.7mm; width:48.0mm; height:9.2mm; }
  .pay-lbl{ top:151.2mm; width:40.2mm; height:9.7mm; }
  .purpose-lbl{ top:160.9mm; width:40.2mm; height:18.2mm; background:#fff; border:.35mm solid #111; flex-direction:column; font-size:4.9mm; line-height:.95; }
  .purpose-lbl .ar3{ margin-top:1.1mm; font-size:5.4mm; direction:rtl; }
  .dept-field{ left:58.1mm; top:135.7mm; width:89.5mm; }
  .pay-field{ left:53.8mm; top:151.5mm; width:141.0mm; }
  .purpose1{ left:53.8mm; top:163.3mm; width:141.1mm; }
  .purpose2{ left:53.8mm; top:171.8mm; width:141.1mm; }

  /* Transfer entity */
  .transfer-row{ position:absolute; left:7.0mm; top:183.4mm; width:168.8mm; height:10.8mm; display:grid; grid-template-columns:61.8mm 1fr; direction:ltr; }
  .transfer-label{ border:.35mm solid #111; background:#bcbcbc; display:flex; align-items:center; justify-content:center; direction:rtl; font-size:6.2mm; font-weight:800; }
  .transfer-input{ border:.35mm solid #111; border-left:0; background:#bcbcbc; padding:1.4mm 2mm; font-size:5mm; font-weight:600; outline:none; direction:auto; }
  .transfer-input:focus{ background:#d4d4d4; }

  /* Amount + currency */
  .amount-row{ position:absolute; left:7.0mm; top:196.5mm; width:191.0mm; height:10.2mm; display:grid; grid-template-columns:43.5mm 81.5mm 42.5mm 23.5mm; direction:ltr; }
  .amount-row > *{ border:.35mm solid var(--orange); min-width:0; }
  .amount-row > * + *{ border-left:0; }
  .amount-label, .currency-label{ background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; line-height:1.02; overflow:hidden; }
  .amount-label{ font-size:4.8mm; direction:ltr; }
  .amount-label .small-ar{ direction:rtl; font-size:4.5mm; margin-top:1mm; }
  .currency-label{ font-size:4.7mm; direction:ltr; }
  .currency-label .small-ar{ direction:rtl; font-size:4.5mm; margin-top:1mm; }
  .boxed-input{ outline:none; background:#fff; padding:1.2mm 2mm; font:600 4.9mm Arial,Tahoma,sans-serif; direction:auto; }
  .boxed-input:focus{ background:rgba(255,244,181,.28); }

  /* Written amount */
  .written-label{ position:absolute; left:7.0mm; top:208.0mm; width:72.6mm; height:9.5mm; border:.35mm solid #6aaa38; background:#fff; display:flex; align-items:center; justify-content:center; font-size:5.0mm; font-weight:700; direction:ltr; }
  .written1{ left:84.5mm; top:207.0mm; width:108.5mm; }
  .written2{ left:84.5mm; top:216.2mm; width:108.5mm; }

  /* Approval boxes */
  .signbox{ position:absolute; top:228.2mm; height:23.3mm; border:.35mm solid var(--orange); background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; font-weight:700; direction:ltr; line-height:1.25; text-align:center; }
  .signbox .red-ar{ color:red; direction:rtl; margin-top:1.1mm; font-size:5.9mm; }
  .prepared{ left:11.5mm; width:52.5mm; font-size:5.1mm; }
  .accounts{ left:73.5mm; width:63.3mm; font-size:5.1mm; }
  .approval{ left:154.4mm; width:39.7mm; font-size:5.1mm; }
  .sig1{ left:10.0mm; top:259.5mm; width:53.0mm; }
  .sig2{ left:75.0mm; top:259.5mm; width:55.5mm; }
  .sig3{ left:149.0mm; top:259.5mm; width:44.0mm; }

  [contenteditable="true"]{ caret-color:#111; }

  @media print{
    html,body{ background:#fff; padding:0; width:210mm; height:297mm; }
    .toolbar{ display:none !important; }
    .sheet-wrap,.sheet{ margin:0; box-shadow:none; }
    .field:focus,.transfer-input:focus,.boxed-input:focus{ background:transparent; box-shadow:none; }
    @page{ size:A4 portrait; margin:0; }
  }
  @media screen and (max-width:900px){
    body{ padding-top:8px; }
    .toolbar{ width:96vw; }
    .sheet-wrap{ transform-origin:top center; }
  }
</style>

          <div class="en">Arab<br>integration factory</div>
          <div class="ar">معمل<br>التكامل<br>العربي</div>
        </header>

        <div class="title-en">Request transfer</div>
        <div class="title-line"></div>
        <div class="title-ar">طلب تحويل</div>

        <div class="date-label"><span>Date ...</span><span class="ar2">التاريخ</span></div>
        <div class="date-input field editable" contenteditable="true" data-field="date" dir="auto"></div>

        <div class="lbl dept-lbl">Department</div>
        <div class="field line-field editable dept-field" contenteditable="true" data-field="department" dir="auto"></div>

        <div class="lbl pay-lbl">Pay to&nbsp; /</div>
        <div class="field line-field editable pay-field" contenteditable="true" data-field="payto" dir="auto"></div>

        <div class="lbl purpose-lbl"><span>Description of</span><span>purpose</span><span class="ar3">الغرض</span></div>
        <div class="field line-field editable purpose1" contenteditable="true" data-field="purpose1" dir="auto"></div>
        <div class="field line-field editable purpose2" contenteditable="true" data-field="purpose2" dir="auto"></div>

        <div class="transfer-row">
          <div class="transfer-label">جهة التحويل</div>
          <div class="transfer-input" contenteditable="true" data-field="transfer" dir="auto"></div>
        </div>

        <div class="amount-row">
          <div class="amount-label"><span>Amount ...</span><span class="small-ar">المبلغ</span></div>
          <div class="boxed-input" contenteditable="true" data-field="amount" dir="auto"></div>
          <div class="currency-label"><span>Currancy /</span><span class="small-ar">العملة</span></div>
          <div class="boxed-input" contenteditable="true" data-field="currency" dir="auto"></div>
        </div>

        <div class="written-label">Written Amount /&nbsp;<span dir="rtl">المبلغ كتابة</span></div>
        <div class="field line-field editable written1" contenteditable="true" data-field="written1" dir="auto"></div>
        <div class="field line-field editable written2" contenteditable="true" data-field="written2" dir="auto"></div>

        <div class="signbox prepared"><span>Prepared by</span><span>(requester)</span><span class="red-ar">اسم مقدم الصرف</span></div>
        <div class="signbox accounts"><span>Accounts</span><span class="red-ar">الحسابات</span></div>
        <div class="signbox approval"><span>Approval</span><span class="red-ar">الموافقة</span></div>

        <div class="field line-field editable sig1" contenteditable="true" data-field="prepared" dir="auto"></div>
        <div class="field line-field editable sig2" contenteditable="true" data-field="accounts" dir="auto"></div>
        <div class="field line-field editable sig3" contenteditable="true" data-field="approval" dir="auto"></div>
      </div>
    </main>
  </div>
<script>
  const fields = [...document.querySelectorAll('[data-field]')];
  const key = 'request-transfer-form-v1';

  function saveFields(){
    const data = {};
    fields.forEach(el => data[el.dataset.field] = el.innerText || '');
    localStorage.setItem(key, JSON.stringify(data));
  }
  function loadFields(){
    try{
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      fields.forEach(el => { if(data[el.dataset.field] != null) el.innerText = data[el.dataset.field]; });
    }catch(e){}
  }
  function clearFields(){
    if(!confirm('هل تريد مسح جميع الحقول المكتوبة؟')) return;
    fields.forEach(el => el.innerText = '');
    localStorage.removeItem(key);
  }
  fields.forEach(el => {
    el.addEventListener('input', saveFields);
    el.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !['purpose1','purpose2','written1','written2'].includes(el.dataset.field)) e.preventDefault();
    });
  });
  loadFields();

  function fitPage(){
    if(window.matchMedia('print').matches) return;
    const mmToPx = 96/25.4;
    const naturalW = 210 * mmToPx;
    const available = Math.min(window.innerWidth * .96, naturalW);
    const scale = Math.min(1, available / naturalW);
    const wrap = document.getElementById('wrap');
    wrap.style.transform = `scale(${scale})`;
    wrap.style.marginBottom = `${(297 * mmToPx) * (scale-1)}px`;
  }
  addEventListener('resize', fitPage);
  fitPage();
</script>
